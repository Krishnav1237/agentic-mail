version: '3.8'
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inbox_intel
    ports:
      # Host 5434, not 5433: 5433 is commonly claimed by a natively-installed
      # PostgreSQL service on developer machines, and a collision there stops
      # this whole stack from coming up.
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'
volumes:
  pgdata:
